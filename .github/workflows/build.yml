name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      linux:
        description: "Build for Linux"
        type: boolean
        default: true
      windows:
        description: "Build for Windows"
        type: boolean
        default: true
      macos:
        description: "Build for macOS"
        type: boolean
        default: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs[matrix.platform] == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs[matrix.platform] == 'true' }}
        with:
          node-version: 24

      - name: Install dependencies
        if: ${{ github.event.inputs[matrix.platform] == 'true' }}
        run: npm ci

      - name: Build application
        if: ${{ github.event.inputs[matrix.platform] == 'true' }}
        run: npm run build

      - name: Upload build artifacts
        if: ${{ github.event.inputs[matrix.platform] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/*.dmg
            dist/release/*.exe
          if-no-files-found: error
