name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag existence and cleanup stale state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="${{ inputs.tag }}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
              echo "::error::Tag ${TAG} already has a release"
              exit 1
            fi

            echo "::warning::Stale tag detected — deleting remote tag"
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG} || true
          fi


  build:
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/
          if-no-files-found: error


  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: ${{ needs.build.result == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="${{ inputs.tag }}"

          echo "Creating release: $TAG"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated release"

          echo "Uploading artifacts..."

          find artifacts -type f | sort | while read file; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done

          echo "Release completed."


  cleanup:
    needs: [validate, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: ${{ failure() && needs.release.result == 'failure' }}

    steps:
      - name: Cleanup tag and release (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          TAG="${{ inputs.tag }}"

          echo "::warning::Cleaning up failed release: ${TAG}"

          gh release delete "$TAG" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/tags/"$TAG" 2>/dev/null || true

          echo "Cleanup finished."
